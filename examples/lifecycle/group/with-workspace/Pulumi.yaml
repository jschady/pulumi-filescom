name: filescom-lifecycle-group
runtime: yaml
description: The program moves the same group to a workspace. Files.com cannot do that move in place.

config:
  groupName:
    type: string
  groupNotes:
    type: string
  workspaceId:
    type: integer

resources:
  group:
    type: filescom:index/group:Group
    properties:
      name: ${groupName}
      notes: ${groupNotes}
      workspaceId: ${workspaceId}

outputs:
  groupId: ${group.id}
