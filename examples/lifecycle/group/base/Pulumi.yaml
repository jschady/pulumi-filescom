name: filescom-lifecycle-group
runtime: yaml
description: The program creates one Files.com group. The stack config gives the name, so every run is unique.

config:
  groupName:
    type: string
  groupNotes:
    type: string

resources:
  group:
    type: filescom:index/group:Group
    properties:
      name: ${groupName}
      notes: ${groupNotes}

outputs:
  groupId: ${group.id}
