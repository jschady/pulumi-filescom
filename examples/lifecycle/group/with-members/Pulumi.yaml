name: filescom-lifecycle-group
runtime: yaml
description: The program creates the same group with members. The stack config gives the user IDs as a comma-delimited list.

config:
  groupName:
    type: string
  groupNotes:
    type: string
  userIds:
    type: string

resources:
  group:
    type: filescom:index/group:Group
    properties:
      name: ${groupName}
      notes: ${groupNotes}
      userIds: ${userIds}

outputs:
  groupId: ${group.id}
