name: filescom-lifecycle-combined
runtime: yaml
description: The program creates one group, one webhook behavior, and one API key in one stack. The group id reaches the API key.

config:
  folderPath:
    type: string
  groupName:
    type: string
  behaviorName:
    type: string
  apiKeyName:
    type: string

resources:
  group:
    type: filescom:index/group:Group
    properties:
      name: ${groupName}
      notes: Combined coverage for the Files.com bridge.
  behavior:
    type: filescom:index/behavior:Behavior
    properties:
      behavior: webhook
      path: ${folderPath}
      name: ${behaviorName}
      value:
        urls:
          - https://example.com/pulumi-filescom-behavior-probe
        method: POST
        triggers:
          - create
        headers:
          x-pulumi-filescom-probe: v1
  # The key reads the group id and the behavior path from the resources, not from the config,
  # so Pulumi creates both before the key and each reference carries a real value.
  apiKey:
    type: filescom:index/apiKey:ApiKey
    properties:
      name: ${apiKeyName}
      description: ${group.id}
      path: ${behavior.path}
      permissionSet: files_only

# The stack exports the ids and the description that holds the reference. The `key` property
# holds a live credential, so no output carries it.
outputs:
  groupId: ${group.id}
  behaviorId: ${behavior.id}
  apiKeyId: ${apiKey.id}
  apiKeyDescription: ${apiKey.description}
