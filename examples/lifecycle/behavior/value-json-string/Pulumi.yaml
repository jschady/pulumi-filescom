name: filescom-lifecycle-behavior
runtime: yaml
description: The program sends the webhook behavior value as one JSON encoded string. The other programs send nested JSON.

config:
  behaviorName:
    type: string
  behaviorPath:
    type: string

resources:
  probe:
    type: filescom:index/behavior:Behavior
    properties:
      behavior: webhook
      path: ${behaviorPath}
      name: ${behaviorName}
      value: '{"urls":["https://example.com/pulumi-filescom-behavior-probe"],"method":"POST","triggers":["create"],"headers":{"x-pulumi-filescom-probe":"v1"}}'

outputs:
  behaviorId: ${probe.id}
  behaviorValue: ${probe.value}
