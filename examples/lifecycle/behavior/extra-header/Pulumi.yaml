name: filescom-lifecycle-behavior
runtime: yaml
description: The program creates the same webhook behavior with a second header. Files.com updates that header in place.

config:
  behaviorName:
    type: string
  behaviorPath:
    type: string
  behaviorType:
    type: string

resources:
  probe:
    type: filescom:index/behavior:Behavior
    properties:
      behavior: ${behaviorType}
      path: ${behaviorPath}
      name: ${behaviorName}
      value:
        urls:
          - https://example.com/pulumi-filescom-behavior-probe
        method: POST
        triggers:
          - create
        headers:
          x-pulumi-filescom-probe: v1
          x-pulumi-filescom-probe-2: v2

outputs:
  behaviorId: ${probe.id}
  behaviorValue: ${probe.value}
