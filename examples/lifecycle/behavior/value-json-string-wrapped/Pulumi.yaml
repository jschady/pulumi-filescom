name: filescom-lifecycle-behavior
runtime: yaml
description: "The second state of the value-json-string program: the same value as the wrapped object."

config:
  behaviorName:
    type: string
  behaviorPath:
    type: string

resources:
  probe:
    type: filescom:index/behavior:Behavior
    properties:
      behavior: webhook
      path: ${behaviorPath}
      name: ${behaviorName}
      value:
        webhook:
          urls:
            - https://example.com/pulumi-filescom-behavior-probe
          method: POST
          triggers:
            - create
          headers:
            x-pulumi-filescom-probe: v1

outputs:
  behaviorId: ${probe.id}
  behaviorValue: ${probe.value}
