[project]
  name = "pulumi_filescom"
  description = "A Pulumi package to create and manage Files.com resources."
  dependencies = ["parver>=0.2.1", "pulumi>=3.231.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["pulumi", "filescom", "files.com", "category/cloud"]
  readme = "README.md"
  requires-python = ">=3.9"
  version = "0.0.0"
  [project.license]
    text = "Apache-2.0"
  [project.urls]
    Homepage = "https://www.files.com"
    Repository = "https://github.com/jschady/pulumi-filescom"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      pulumi_filescom = ["py.typed", "pulumi-plugin.json"]
