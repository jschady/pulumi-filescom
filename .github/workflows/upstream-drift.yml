name: upstream-drift

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tag_check:
    name: tag_check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          # The submodule needs its tags, so the check can name the pinned release.
          fetch-depth: 0
      - name: Check the 3 upstream pins agree
        run: ./scripts/upstream.sh check
      - name: Compare the pinned tag with the latest upstream release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          slug=$(git config --file .gitmodules submodule.upstream.url | sed -E 's#.*github\.com/##; s#\.git$##')
          pinned=$(git -C upstream describe --tags --exact-match HEAD 2>/dev/null || true)
          if [ -z "${pinned}" ]; then
            echo "The upstream submodule points at a commit with no tag."
            echo "Check out a release tag inside upstream. Commit the changed gitlink."
            exit 1
          fi
          latest=$(gh release view --repo "${slug}" --json tagName --jq .tagName)
          echo "repository=${slug} pinned=${pinned} latest=${latest}"
          if [ "${pinned}" != "${latest}" ]; then
            echo "The pin is ${pinned}. The latest ${slug} release is ${latest}."
            echo "Check out ${latest} inside upstream. Commit the changed gitlink."
            exit 1
          fi
          echo "The pin matches the latest upstream release."
