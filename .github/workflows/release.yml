name: release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

env:
  PROVIDER: filescom
  PULUMI_VERSION: 3.258.0
  PULUMICTL_VERSION: v0.0.50
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  PULUMI_BACKEND_URL: file://~
  PULUMI_CONFIG_PASSPHRASE: ci-local-passphrase
  PULUMI_LOCAL_NUGET: ${{ github.workspace }}/nuget
  PULUMI_IGNORE_AMBIENT_PLUGINS: "true"
  PULUMI_DISABLE_AUTOMATIC_PLUGIN_ACQUISITION: "true"

jobs:
  prerequisites:
    name: prerequisites
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Set up the Go toolchain
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - name: Install the pinned Pulumi CLI
        run: |
          curl -fsSL "https://github.com/pulumi/pulumi/releases/download/v${PULUMI_VERSION}/pulumi-v${PULUMI_VERSION}-linux-x64.tar.gz" -o /tmp/pulumi.tar.gz
          tar -xzf /tmp/pulumi.tar.gz -C /tmp
          echo "/tmp/pulumi" >> "$GITHUB_PATH"
      - name: Install pulumictl
        run: |
          go install "github.com/pulumi/pulumictl/cmd/pulumictl@${PULUMICTL_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Set the provider version
        id: version
        uses: pulumi/provider-version-action@v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install the pinned Terraform converter plugin
        run: make converter_plugin
      - name: Generate the schema
        run: make tfgen
      - name: Check the worktree is clean
        run: ./scripts/check-worktree-clean.sh
      - name: Build the provider
        run: make provider
      - name: Package the provider binaries
        run: tar -zcf bin/provider.tar.gz -C bin "pulumi-resource-${PROVIDER}" "pulumi-tfgen-${PROVIDER}"
      - name: Upload the provider artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: provider.tar.gz
          path: bin/provider.tar.gz
          retention-days: 7

  build_sdks:
    name: build_sdks
    needs: prerequisites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - nodejs
          - python
          - dotnet
          - go
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Set up the Go toolchain
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - name: Set up Node
        if: matrix.language == 'nodejs'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - name: Install Yarn
        if: matrix.language == 'nodejs'
        run: npm install -g yarn@1.22.22
      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Set up .NET
        if: matrix.language == 'dotnet'
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Install the pinned Pulumi CLI
        run: |
          curl -fsSL "https://github.com/pulumi/pulumi/releases/download/v${PULUMI_VERSION}/pulumi-v${PULUMI_VERSION}-linux-x64.tar.gz" -o /tmp/pulumi.tar.gz
          tar -xzf /tmp/pulumi.tar.gz -C /tmp
          echo "/tmp/pulumi" >> "$GITHUB_PATH"
      - name: Install pulumictl
        run: |
          go install "github.com/pulumi/pulumictl/cmd/pulumictl@${PULUMICTL_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Set the provider version
        id: version
        uses: pulumi/provider-version-action@v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare the local workspace
        run: make prepare_local_workspace
      - name: Download the provider artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: provider.tar.gz
          path: bin
      - name: Restore the provider binaries
        # touch keeps make from rebuilding: a fresh checkout is newer than the artifact.
        run: |
          tar -zxf bin/provider.tar.gz -C bin
          chmod +x "bin/pulumi-resource-${PROVIDER}" "bin/pulumi-tfgen-${PROVIDER}"
          touch "bin/pulumi-resource-${PROVIDER}" "bin/pulumi-tfgen-${PROVIDER}"
      - name: Check the built provider serves the committed schema
        # The unit job installs no Pulumi CLI and builds no provider, so the check skips
        # there. This job restored both, and a skip reads as a pass.
        run: |
          cd provider
          go test -count=1 -run TestTheBuiltProviderServesTheCommittedSchema ./...
      - name: Generate the SDK
        run: make generate_${{ matrix.language }}
      - name: Build the SDK
        run: make build_${{ matrix.language }}
      - name: Check the worktree is clean
        run: ./scripts/check-worktree-clean.sh
      - name: Package the SDK
        run: tar -zcf "sdk/${{ matrix.language }}.tar.gz" -C "sdk/${{ matrix.language }}" .
      - name: Upload the SDK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.language }}-sdk.tar.gz
          path: sdk/${{ matrix.language }}.tar.gz
          retention-days: 7

  unit:
    name: unit
    needs: build_sdks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Set up the Go toolchain
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - name: Install pulumictl
        run: |
          go install "github.com/pulumi/pulumictl/cmd/pulumictl@${PULUMICTL_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install actionlint
        run: |
          bin="$RUNNER_TEMP/actionlint-bin"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $bin/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$bin/actionlint.tar.gz" -C "$bin" actionlint
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/actionlint" --version
      - name: Fetch the upstream tags
        run: git -C upstream fetch --tags --depth=1 origin
      - name: Test the provider
        run: make test_provider

  # The SDK set is confirmed before any binary publishes. A release page carrying binaries
  # that no SDK can be published against is a release nobody can consume.
  confirm_sdks:
    name: confirm_sdks
    needs: build_sdks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set the provider version
        id: version
        uses: pulumi/provider-version-action@v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download every SDK artifact
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: "*-sdk.tar.gz"
          path: sdk-artifacts
      - name: Restore the 4 SDKs
        run: |
          for language in nodejs python dotnet go; do
            mkdir -p "sdk-set/${language}"
            tar -zxf "sdk-artifacts/${language}-sdk.tar.gz/${language}.tar.gz" -C "sdk-set/${language}"
          done
      - name: Confirm the SDK layout
        run: ./scripts/check-sdk-artifacts.sh sdk-set "${{ steps.version.outputs.version }}"

  publish_provider:
    name: publish_provider
    needs:
      - unit
      - confirm_sdks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          # GoReleaser reads the tag history to name the release.
          fetch-depth: 0
      - name: Set up the Go toolchain
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - name: Set the provider version
        id: version
        uses: pulumi/provider-version-action@v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The six cross-compiled builds outgrow the runner's free disk; the preinstalled
      # toolchains this job never touches make the room.
      - name: Free the runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - name: Publish the provider binaries
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: "~> v2"
          args: release --clean --timeout 60m0s --parallelism 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ steps.version.outputs.version }}

  publish_sdks:
    name: publish_sdks
    needs: publish_provider
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # PyPI trusted publishing and npm provenance both sign with this token.
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set the provider version
        id: version
        uses: pulumi/provider-version-action@v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Download the nodejs SDK artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: nodejs-sdk.tar.gz
          path: sdk
      - name: Download the python SDK artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-sdk.tar.gz
          path: sdk
      - name: Download the dotnet SDK artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: dotnet-sdk.tar.gz
          path: sdk
      - name: Restore the 3 SDKs
        run: |
          for language in nodejs python dotnet; do
            mkdir -p "sdk/${language}"
            tar -zxf "sdk/${language}.tar.gz" -C "sdk/${language}"
          done
      - name: Publish the nodejs SDK
        run: |
          if [ "${PROVIDER_VERSION#*-}" != "${PROVIDER_VERSION}" ]; then
            npm_tag=dev
          else
            npm_tag=latest
          fi
          cd sdk/nodejs/bin
          npm publish --provenance --access public --tag "${npm_tag}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish the python SDK
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: sdk/python/bin/dist
      - name: Publish the dotnet SDK
        run: |
          find sdk/dotnet/bin -name '*.nupkg' -print -exec \
            dotnet nuget push {} -k "$NUGET_PUBLISH_KEY" -s https://api.nuget.org/v3/index.json \;
        env:
          NUGET_PUBLISH_KEY: ${{ secrets.NUGET_PUBLISH_KEY }}

  publish_go_sdk:
    name: publish_go_sdk
    needs: publish_sdks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set the provider version
        id: version
        uses: pulumi/provider-version-action@v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the go SDK artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: go-sdk.tar.gz
          path: sdk
      - name: Restore the go SDK
        run: |
          mkdir -p sdk/go
          tar -zxf sdk/go.tar.gz -C sdk/go
      - name: Publish the go SDK
        uses: pulumi/publish-go-sdk-action@v1.2.0
        with:
          repository: ${{ github.repository }}
          base-ref: ${{ github.sha }}
          source: sdk/go/filescom
          path: sdk/go/filescom
          version: ${{ steps.version.outputs.version }}
          additive: false
          files: "**"
